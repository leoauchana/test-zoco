name: Backend CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        env:
          GROQ_API_KEY: fake-test-key
        run: npm run test

      - name: Build project
        run: npm run build
